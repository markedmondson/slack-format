name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Verify installed command and version
        run: |
          python - <<'PY'
          import subprocess
          from importlib.metadata import version

          import slack_format

          installed_version = version("slack-format")
          assert slack_format.__version__ == installed_version
          output = subprocess.check_output(["slack-format", "--version"], text=True)
          assert output.strip() == f"slack-format {installed_version}"
          PY
      - name: Run tests
        run: python -m unittest discover -s tests
