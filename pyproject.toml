[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-format"
version = "0.1.0"
description = "Format Markdown for clean pasting into Slack, including readable tables."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
  "Topic :: Text Processing :: Markup",
]

[project.scripts]
slack-format = "slack_format.cli:main"

[project.urls]
Homepage = "https://github.com/markedmondson/slack-format"
Issues = "https://github.com/markedmondson/slack-format/issues"

[tool.setuptools.packages.find]
where = ["src"]
